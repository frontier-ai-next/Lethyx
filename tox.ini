[tox]
requires = tox>=4.32
env_list = lint, format, typecheck, test-py312, test-py313, coverage
skip_missing_interpreters = true

[testenv]
package = editable
extras =
    dev
    hindsight
    openai
    mcp
set_env =
    PYTHONPATH = {toxinidir}/src
pass_env =
    HINDSIGHT_*
    LLM_*
    OPENAI_*
    LETHYX_*
commands =
    pytest tests -q --tb=short

[testenv:test-py312]
base_python = 3.12
commands =
    pytest tests -q --tb=short

[testenv:test-py313]
base_python = 3.13
commands =
    pytest tests -q --tb=short

[testenv:lint]
skip_install = true
deps = .[dev]
commands =
    ruff check .

[testenv:format]
skip_install = true
deps = .[dev]
commands =
    ruff format --check .

[testenv:typecheck]
commands =
    mypy

[testenv:coverage]
commands =
    coverage erase
    coverage run -m pytest tests -q --tb=short
    coverage report --show-missing
    coverage xml
    coverage html
