[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "um-mem"
version = "0.6.0"
description = "Framework-neutral memory layer for agent systems."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
    "filelock>=3.29.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "mempalace>=3.5.0",
    "mnemosyne-memory>=3.10.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.3.0",
    "coverage[toml]>=7.13.0",
    "mypy>=1.20,<2",
    "pre-commit>=4.5.0",
    "pytest>=9.1.1",
    "ruff>=0.15.19",
    "tox>=4.32.0",
    "types-PyYAML>=6.0.12,<7",
    "tomlkit>=0.13,<1",
]
hindsight = ["hindsight-client>=0.8.3,<0.9"]
hindsight-local = ["hindsight-all>=0.8.3,<0.9", "litellm==1.90.0"]
semantic = ["fastembed>=0.9,<0.10"]
zvec = ["zvec>=0.7,<0.8"]
openai = ["openai>=2.43.0"]
mcp = ["mcp>=1.20.0,<2", "ruamel.yaml>=0.18,<1", "tomlkit>=0.13,<1"]
docs = ["mkdocs-material>=9,<10"]

[project.scripts]
um-memory = "um_mem.memory.cli:main"
um-memory-mcp = "um_mem.memory.mcp_server:main"
um-memory-codex-hook = "um_mem.integrations.codex_hooks:main"
um-memory-claude-hook = "um_mem.integrations.claude_hooks:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["um_mem*"]

[tool.setuptools.package-data]
"um_mem.memory.blocks" = ["*.yaml"]
"um_mem.memory" = ["panel/*.html", "panel/*.css", "panel/*.js"]

[tool.coverage.run]
branch = true
source = ["src/um_mem"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true
extend-exclude = [
    ".external",
    ".hermes",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
# The defaults of the pinned ruff release are the project policy. Ignore the
# rules whose findings contradict a deliberate contract instead of papering
# over them at call sites.
ignore = [
    # The public API raises ValueError for invalid types on purpose: 269 tests
    # assert it and host integrations catch ValueError.
    "TRY004",
]

[tool.ruff.lint.per-file-ignores]
# These modules are documented "never raise" boundaries: optional advisory
# tiers, the MCP transport, the host tool dispatcher, and the fail-closed
# durable writer. A blind except there is the contract, not an accident.
"src/um_mem/memory/mcp_facade.py" = ["BLE001"]
"src/um_mem/memory/mcp_server.py" = ["BLE001"]
"src/um_mem/memory/mcp_call.py" = ["BLE001"]
"src/um_mem/memory/local_tier.py" = ["BLE001"]
"src/um_mem/memory/memory_map.py" = ["BLE001"]
"src/um_mem/memory/semantic.py" = ["BLE001"]
"src/um_mem/memory/kernel/writer.py" = ["BLE001"]
"src/um_mem/integrations/hermes_provider.py" = ["BLE001"]
"tests/*" = ["BLE001"]

[tool.mypy]
python_version = "3.12"
files = ["src/um_mem"]
warn_unused_configs = true
