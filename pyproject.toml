[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "lethyx"
version = "0.6.0"
description = "Framework-neutral memory layer for agent systems."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
    "filelock>=3.29.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "mempalace>=3.5.0",
    "mnemosyne-memory>=3.10.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.3.0",
    "coverage[toml]>=7.13.0",
    "mypy>=1.20,<2",
    "pre-commit>=4.5.0",
    "pytest>=9.1.1",
    "ruff>=0.15.19",
    "tox>=4.32.0",
    "types-PyYAML>=6.0.12,<7",
    "tomlkit>=0.13,<1",
]
hindsight = ["hindsight-client>=0.8.3,<0.9"]
hindsight-local = ["hindsight-all>=0.8.3,<0.9", "litellm==1.90.0"]
semantic = ["fastembed>=0.9,<0.10"]
zvec = ["zvec>=0.7,<0.8"]
openai = ["openai>=2.43.0"]
mcp = ["mcp>=1.20.0,<2", "ruamel.yaml>=0.18,<1", "tomlkit>=0.13,<1"]
docs = ["mkdocs-material>=9,<10"]

[project.scripts]
lethyx = "lethyx.memory.cli:main"
lethyx-mcp = "lethyx.memory.mcp_server:main"
lethyx-codex-hook = "lethyx.integrations.codex_hooks:main"
lethyx-claude-hook = "lethyx.integrations.claude_hooks:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lethyx*"]

[tool.setuptools.package-data]
"lethyx.memory.blocks" = ["*.yaml"]

[tool.coverage.run]
branch = true
source = ["src/lethyx"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "memory_contract: core memory injection invariants",
    "memory_slow: optional persistent backend matrix",
    "hindsight: optional real Hindsight server tests",
    "hindsight_real: requires real Hindsight server",
    "llm_memory: opt-in LLM behavioral memory tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true
extend-exclude = [
    ".external",
    ".hermes",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.mypy]
python_version = "3.12"
files = ["src/lethyx"]
warn_unused_configs = true
