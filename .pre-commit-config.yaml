repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format-check
        name: ruff format check
        entry: python -m ruff format --check .
        language: system
        pass_filenames: false
      - id: package-data-metadata
        name: package data metadata
        entry: python -m pytest tests/test_package_metadata.py -q
        language: system
        pass_filenames: false
