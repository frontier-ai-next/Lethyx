id: 13_phase_contract_symmetry
description: >
  Offline phase-regression scenario for the calculator class of failures:
  research summary/palace_add recovery, plan-review required_plan_change
  symmetry, src-layout import proofs, and Tk/headless test mistakes.
workspace: test
mode: phase_contract_regression

env:
  LETHYX_ALLOW_VOLATILE_MEMORY_STUB: "1"

seed:
  workspace_fixture: default
  manager_fixture: manager_default

steps:
  - id: research_summary_yields_to_palace_add
    action: phase_forced_completion
    phase: research
    run_id: run-phase-contract-symmetry
    args:
      terminating_tools:
        - submit_research_summary
      accepted_terminating_tools:
        - submit_capability_declaration
      rounds_in_phase: 99
      trace_tool_calls:
        - tool: submit_research_summary
          is_error: false
          result: >
            ERROR: research summary references finding id(s) that were not
            accepted by palace_add as research_finding for this task. Before
            retrying submit_research_summary, call palace_add.
      expect_forced_tool: palace_add
      expect_message_contains:
        - REQUIRED_RESEARCH_FINDING_PENDING

  - id: research_allows_palace_add_under_summary_force
    action: phase_no_write_guard
    phase: research
    run_id: run-phase-contract-symmetry
    args:
      forced_tool: submit_research_summary
      tool_calls:
        - id: call_palace_add
          tool: palace_add
          arguments:
            kind: research_finding
            title: Tkinter calculator tutorial
            content: Tkinter supports small desktop calculator GUIs.
            source_id: web_search:tkinter-calculator
      trace_tool_calls:
        - tool: submit_research_summary
          is_error: false
          result: >
            ERROR: research summary needs findings_ids from accepted palace_add
            result ids. Before retrying `submit_research_summary`, call
            `palace_add` with kind="research_finding".
      expect_rejected: false

  - id: plan_review_precise_command_replace
    action: submit_micro_review
    phase: plan_review
    run_id: run-phase-contract-symmetry
    args:
      verdict: revise
      loop_back_target: plan
      coverage:
        policy_conflicts: true
        oracle_compatibility: true
        proof_strength: true
        scope_validity: true
        runtime_capabilities: true
        test_validity: true
      submitted_plan:
        plan:
          subtasks:
            - id: implement-core-logic
              proof:
                execution:
                  command:
                    - python
                    - -m
                    - pytest
                    - tests/test_core.py::test_add
                    - -q
                scope:
                  pytest_targets:
                    - tests/test_core.py::test_add
                    - tests/test_core.py::test_divide_by_zero
      issues:
        - code: proof_scope_mismatch
          severity: blocking
          subtask_id: implement-core-logic
          message: Proof command only runs one pytest target.
      required_plan_changes:
        - id: implement-core-logic-proof
          target_subtask_id: implement-core-logic
          path: proof.execution.command
          op: replace
          value:
            - python
            - -m
            - pytest
            - tests/test_core.py::test_add
            - tests/test_core.py::test_divide_by_zero
            - -q
          severity: blocking
          reason_code: proof_scope_mismatch
      expect_result_prefix: "OK:"
      expect_required_plan_changes:
        - id: implement-core-logic-proof
          target_subtask_id: implement-core-logic
          path: proof.execution
          op: semantic_diff
      expect_absent_change_ids:
        - proof_scope_mismatch-implement-core-logic

  - id: plan_revision_satisfies_semantic_proof_execution_change
    action: validate_required_plan_change
    phase: plan
    run_id: run-phase-contract-symmetry
    args:
      plan:
        subtasks:
          - id: implement-core-logic
            proof:
              execution:
                command:
                  - python
                  - -m
                  - pytest
                  - tests/test_core.py::test_add
                  - tests/test_core.py::test_divide_by_zero
                  - -q
              scope:
                pytest_targets:
                  - tests/test_core.py::test_add
                  - tests/test_core.py::test_divide_by_zero
      change:
        id: implement-core-logic-proof
        target_subtask_id: implement-core-logic
        path: proof.execution
        op: semantic_diff
        previous_value:
          command:
            - python
            - -m
            - pytest
            - tests/test_core.py::test_add
            - -q
        severity: blocking
        reason_code: proof_scope_mismatch
      expect_issue_empty: true

  - id: execute_src_layout_import_without_src_path
    action: validate_phase_plan_contract
    phase: execute
    run_id: run-phase-contract-symmetry
    args:
      workspace_id: calculator
      plan:
        subtasks:
          - id: create-gui-module
            title: GUI module
            goal: Create an importable calculator GUI module.
            files_to_create:
              - pyproject.toml
              - src/calculator/app.py
            proof:
              execution:
                kind: command
                command:
                  - python
                  - -c
                  - "import importlib; importlib.import_module('calculator.app')"
              oracle:
                oracle_type: unit_assertions
                required_properties:
                  - module_imports
              scope:
                files_under_test:
                  - src/calculator/app.py
                changed_files_expected:
                  - pyproject.toml
                  - src/calculator/app.py
              anti_gaming:
                requires_real_runtime: false
      expect_issue_codes:
        - package_import_env_mismatch

  - id: execute_src_layout_import_with_src_path
    action: validate_phase_plan_contract
    phase: execute
    run_id: run-phase-contract-symmetry
    args:
      workspace_id: calculator
      plan:
        subtasks:
          - id: create-gui-module
            title: GUI module
            goal: Create an importable calculator GUI module.
            files_to_create:
              - pyproject.toml
              - src/calculator/app.py
            proof:
              execution:
                kind: command
                command:
                  - python
                  - -c
                  - "import sys, importlib; sys.path.insert(0, 'src'); importlib.import_module('calculator.app')"
              oracle:
                oracle_type: unit_assertions
                required_properties:
                  - module_imports
              scope:
                files_under_test:
                  - src/calculator/app.py
                changed_files_expected:
                  - pyproject.toml
                  - src/calculator/app.py
              anti_gaming:
                requires_real_runtime: false
      expect_absent_issue_codes:
        - package_import_env_mismatch

  - id: tk_masterless_widget_test_rejected
    action: analyze_python_test
    phase: execute
    run_id: run-phase-contract-symmetry
    args:
      path: tests/test_gui_headless.py
      source: |
        import tkinter as tk

        def test_button():
            btn = tk.Button()
            assert btn is not None
      expect_issue_codes:
        - masterless_gui_widget_in_test
