id: llm_loop_debug_current_control
description: Real LLM should use compact current run state for loop debugging and not call unverified soft exits success.
workspace: test
mode: phase_prompt

seed:
  workspace_fixture: default
  manager_core:
    bkb:
      rules:
        - id: platform_current_control_verdict_debug
          title: Debug repeated loopbacks from compact run state
          scope: manager
          type: behavior
          status: active
          trust: verified
          applies_to:
            phases: ["execute"]
            workspaces: ["*"]
            agents: ["*"]
          rule:
            behavior: >-
              When debugging repeated loop_back or retry_exhausted behavior,
              inspect .memory/drive/state/current_control_verdict.json first.
              Treat final_report.status=unverified or retry_exhausted as not a
              verified success.

steps:
  - id: execute_prompt
    action: build_phase_task
    phase: execute
    run_id: run-llm-4

llm:
  step_id: execute_prompt
  task_question: >
    A phase repeatedly looped back and ended retry_exhausted with
    final_report.status=unverified. Which state artifact should you inspect
    first, and is this a successful run? One sentence.
  expect_current_control_verdict: true
  forbid_false_success: true

assert:
  execute_prompt:
    single_always_loaded: true
    bkb:
      included_ids:
        - platform_current_control_verdict_debug
