# memory_bench suite configuration
# Run: python -m memory_bench run --suite suite.toml

[responder]
model = "gemma-4-31B-it"
temperature = 0.0
max_tokens = 512

[judge]
llm_judge_model = "gemma-4-31B-it"
use_llm_judge = true

[limits]
recall_k = 10
max_context_tokens = 4000
max_episodes = 0        # 0 = all available
max_probes_per_episode = 0
seed = 0
max_parallel = 20

[suite]
benchmarks = ["agent_quality", "locomo", "longmemeval", "beam"]
# Add "memoryarena" and "evomembench" for agentic evaluation

# -------------------------------------------------------------------
# Providers (backends under test)
# -------------------------------------------------------------------

[[provider]]
id = "lethyx-mempalace"
adapter = "lethyx"
backend = "mempalace"

[[provider]]
id = "lethyx-hindsight"
adapter = "lethyx"
backend = "hindsight"

[[provider]]
id = "lethyx-mnemosyne"
adapter = "lethyx"
backend = "mnemosyne"

# -------------------------------------------------------------------
# Baseline providers (reference points)
# -------------------------------------------------------------------

[[provider]]
id = "baseline-no-memory"
adapter = "no_memory"

[[provider]]
id = "baseline-full-context"
adapter = "full_context"

[[provider]]
id = "baseline-bm25"
adapter = "bm25"

[[provider]]
id = "raw-mempalace"
adapter = "raw-mempalace"

[[provider]]
id = "raw-mnemosyne"
adapter = "raw-mnemosyne"
